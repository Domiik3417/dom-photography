name: Deploy Dom Photography to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Generate gallery manifest
        run: node scripts/generate-gallery.mjs
      - name: Prepare static artifact
        run: |
          mkdir -p _site
          sed -i "s|https://YOUR_GITHUB_PAGES_URL|${{ steps.pages.outputs.base_url }}|g" robots.txt sitemap.xml
          cp index.html styles.css app.js favicon.svg robots.txt sitemap.xml _site/
          cp -r public _site/public
          if [ -d photos ]; then cp -r photos _site/photos; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
